<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
            <span class="switch-track"></span>
            <span id="theme-label">Oscuro</span>
          </button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="records hidden"></div>
        <div id="record-form" class="record-form hidden">
          <input id="record-name" type="text" maxlength="12" value="Jugador" aria-label="Nombre del jugador" autocomplete="off" />
          <button id="record-save-btn" type="button">Guardar</button>
        </div>
        <p id="record-note"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <p class="records-heading">TOP 5</p>
        <div id="start-records" class="records"></div>
        <button id="play-btn" type="button">Jugar</button>
        <button id="reset-records-btn" type="button">Borrar récords</button>
      </div>
    </div>
    <div id="pause-overlay" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="pause-box">
        <p id="pause-title">PAUSA</p>
        <button id="pause-resume" class="pause-item" type="button">Reanudar</button>
        <button id="pause-restart" class="pause-item" type="button">Reiniciar</button>
        <button id="pause-controls-btn" class="pause-item" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd>/<kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
        </ul>
        <div id="start-level-row" class="pause-item pause-level" tabindex="0" role="spinbutton" aria-label="Nivel inicial" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
          <span>Nivel inicial</span>
          <button id="start-level-dec" type="button" tabindex="-1" aria-label="Disminuir nivel">−</button>
          <span id="start-level-value">1</span>
          <button id="start-level-inc" type="button" tabindex="-1" aria-label="Aumentar nivel">+</button>
        </div>
        <p id="pause-hint">El nivel inicial aplica a la próxima partida (Reiniciar).</p>
      </div>
  </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
